[project]
name = "pj22-btc"
version = "0.1.0"
description = "Исследовательский проект для BTC-стратегий на данных MEXC и sentiment-сигналах."
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "plotly>=6.7.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.0",
    "tiktoken>=0.12.0",
    "tqdm>=4.67.3",
    "tzdata>=2026.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
